name: "SonarQube scan"
description: >
  Runs a SonarQube scan. Coverage is whatever the workspace already holds when
  this runs, either merged into place by a composite earlier in the job or
  downloaded here by name; each repository's sonar-project.properties says where
  the scanner looks for it.

inputs:
  sonar-token:
    description: "SonarQube token"
    required: true
  build-artifact-name:
    description: "Artifact holding what the scanner reads, such as compile_commands.json."
    required: false
  coverage-artifact-name:
    description: "Coverage artifact to download. Left out, whatever is local is used."
    required: false
  coverage-path:
    description: "Path the coverage artifact is downloaded into."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Ensure checkout
      uses: gigabit-clowns/.github/.github/composites/ensure-checkout@main
      with:
        shallow: false

    - name: Download build artifact
      if: ${{ inputs.build-artifact-name }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.build-artifact-name }}
        path: ${{ github.workspace }}/build

    - name: Download coverage artifact
      if: ${{ inputs.coverage-artifact-name }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.coverage-artifact-name }}
        path: ${{ inputs.coverage-path }}

    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      with:
        args: >-
          ${{ github.event_name == 'workflow_dispatch'
              && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
