name: "Generate Coverage Report"
description: "Generates coverage reports for every OS."

inputs:
  compiler-c:
    description: "C compiler being used by the runner."
    required: true
  compiler-cxx:
    description: "C++ compiler being used by the runner."
    required: true
  cl-coverage-tool:
    description: "Path to the coverage tool used by Windows with MSVC."
    required: false
  normalize-paths:
    description: >
      Replace this workspace with a placeholder, so merge-cpp-coverage-reports
      can put the merging runner's own path back. Leave it off when the report
      is read where it was produced; on, it is unreadable until merged.
    required: false
    default: true
  report-path:
    description: "Path to save the coverage report."
    required: false
    default: "coverage.lcov"

runs:
  using: "composite"
  steps:
    - name: Set gcov executable
      id: set-gcov-executable
      if: inputs.compiler-c != 'cl' && inputs.compiler-cxx != 'cl'
      shell: bash
      env:
        COMPILER_C: ${{ inputs.compiler-c }}
        COMPILER_CXX: ${{ inputs.compiler-cxx }}
      run: |
        if [[ "$COMPILER_C" == "clang" && "$COMPILER_CXX" == "clang++" ]]; then
          echo "gcov-executable=llvm-cov gcov" >> "$GITHUB_OUTPUT"
        else
          echo "gcov-executable=gcov" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate coverage report (all but MSVC)
      if: inputs.compiler-c != 'cl' && inputs.compiler-cxx != 'cl'
      working-directory: "${{ github.workspace }}/build"
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        gcovr -r "${{ github.workspace }}" \
          --object-directory "${{ github.workspace }}/build" \
          --gcov-executable "${{ steps.set-gcov-executable.outputs.gcov-executable }}" \
          --merge-lines \
          --exclude-throw-branches \
          --exclude-unreachable-branches \
          --lcov="$REPORT_PATH" \
          --txt="${REPORT_PATH%.lcov}.txt" \
          --exclude '.*_deps/.*'

    - name: Generate coverage report (Windows with MSVC)
      if: inputs.compiler-c == 'cl' && inputs.compiler-cxx == 'cl' && inputs.cl-coverage-tool != ''
      uses: gigabit-clowns/.github/.github/composites/run-ctest/internal@main
      with:
        test-wrapper: >-
          "${{ inputs.cl-coverage-tool }}" --working_dir="${{ github.workspace }}\build"
          --modules="${{ github.event.repository.name }}"
          --sources="${{ github.workspace }}"
          --excluded_sources="*_deps*"
          --excluded_sources="*_work*"
          --export_type="cobertura:${{ inputs.report-path }}"
          --cover_children --

    - name: Normalize report paths (all but MSVC)
      if: >-
        inputs.normalize-paths == 'true' &&
        inputs.compiler-c != 'cl' && inputs.compiler-cxx != 'cl'
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        # Replace workspace with placeholder for later unification
        ws=$(echo "$GITHUB_WORKSPACE" | sed 's|\\|/|g')
        sed -i.bak "s|$ws|GITHUB_WORKSPACE|g" "$REPORT_PATH"
        rm -f "$REPORT_PATH.bak"

    - name: Normalize report paths (Windows with MSVC)
      if: >-
        inputs.normalize-paths == 'true' && inputs.compiler-c == 'cl' &&
        inputs.compiler-cxx == 'cl' && inputs.cl-coverage-tool != ''
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        target="$GITHUB_WORKSPACE/msvc_path_normalization.py"
        source_file="$GITHUB_ACTION_PATH/../../../scripts/coverage/msvc_path_normalization.py"
        [ -f "$source_file" ] || {
          echo "No script at $source_file" >&2
          exit 1
        }
        cp "$source_file" "$target"

        echo "Copied script to $target"
        python ./msvc_path_normalization.py "$REPORT_PATH" --placeholder="GITHUB_WORKSPACE"

    - name: Show coverage summary
      if: inputs.compiler-c != 'cl' && inputs.compiler-cxx != 'cl'
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
      run: cat "${REPORT_PATH%.lcov}.txt"
