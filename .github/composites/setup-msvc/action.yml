name: Set up MSVC environment
description: Put the MSVC toolchain for this runner's architecture on PATH.

runs:
  using: composite
  steps:
  - name: Set up MSVC environment
    shell: pwsh
    run: |
      $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
      # vcvars64 targets x64 even on an ARM64 runner, where it cross compiles.
      $arm = $env:RUNNER_ARCH -eq 'ARM64'
      $tools = if ($arm) { 'ARM64' } else { 'x86.x64' }
      $script = if ($arm) { 'vcvarsarm64.bat' } else { 'vcvars64.bat' }
      $install = & $vswhere -latest -products * `
        -requires "Microsoft.VisualStudio.Component.VC.Tools.$tools" `
        -property installationPath
      if (-not $install) { throw 'No Visual Studio installation with the C++ tools' }
      $vcvars = Join-Path $install "VC\Auxiliary\Build\$script"
      if (-not (Test-Path $vcvars)) { throw "No $script in $install" }
      cmd /c "`"$vcvars`" && set" |
        Where-Object { $_ -match '^([^=]+)=(.*)$' } |
        ForEach-Object { "$($Matches[1])=$($Matches[2])" } |
        Add-Content -Path $env:GITHUB_ENV -Encoding utf8
