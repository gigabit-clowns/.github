name: Save the fetched sources
description: Store what restore-fetched did not find.

runs:
  using: composite
  steps:
  - name: Check that the sources were restored first
    shell: bash
    run: |
      if [ -z "${FETCHED_KEY:-}" ]; then
        echo "restore-fetched did not run in this job" >&2
        exit 1
      fi

  - if: env.FETCHED_HIT != 'true'
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ${{ runner.os == 'Windows' && 'C:/fetched' || '/tmp/fetched' }}
      key: ${{ env.FETCHED_KEY }}
