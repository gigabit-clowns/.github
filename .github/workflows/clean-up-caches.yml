name: Clean up caches
permissions: {}

on:
  workflow_call:
    inputs:
      scope:
        # workflow_call has no choice type; the caller's dispatch has one.
        description: Which caches go, "every" or "all".
        required: true
        type: string
      ref:
        description: Ref or branch to restrict to. Every ref when left empty.
        required: false
        default: ""
        type: string
      target_mib:
        description: What the headroom pass frees down to.
        required: false
        default: 8192
        type: number

jobs:
  clean_up_caches:
    name: Delete ${{ inputs.scope }} caches
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
    - name: Clean up caches
      uses: gigabit-clowns/.github/.github/composites/clean-up-caches@main
      with:
        scope: ${{ inputs.scope }}
        ref: ${{ inputs.ref }}
        token: ${{ github.token }}

  headroom:
    name: Free space if the repository is over its target
    needs: [clean_up_caches]
    # Every event fires one scope and skips the other, and a skipped job
    # skips what needs it. This has to run either way, and after.
    if: ${{ !cancelled() }}
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
    - name: Clean up caches
      uses: gigabit-clowns/.github/.github/composites/clean-up-caches@main
      with:
        scope: headroom
        target_mib: ${{ inputs.target_mib }}
        token: ${{ github.token }}
