name: Clean up caches
permissions: {}

on:
  workflow_call:
    inputs:
      scope:
        description: Which caches go, "superseded" or "all".
        required: true
        type: string
      ref:
        description: Ref or branch to restrict to. Every ref when left empty.
        required: false
        default: ""
        type: string
      tails:
        description: >-
          A JSON list of regular expressions for what varies between the
          caches of one group: a timestamp, a commit, a run id or a content
          hash when left out.
        required: false
        default: >-
          ["-[0-9]{4}-[0-9]{2}-[0-9]{2}T.*$", "-[0-9a-f]{64}$",
           "-[0-9a-f]{40}$", "-[0-9]{6,}$"]
        type: string
      target_mib:
        description: What the headroom pass frees down to.
        required: false
        default: 8192
        type: number

jobs:
  clean_up_caches:
    name: Delete ${{ inputs.scope }} caches
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
    - name: Clean up caches
      uses: gigabit-clowns/.github/.github/composites/clean-up-caches@main
      with:
        scope: ${{ inputs.scope }}
        ref: ${{ inputs.ref }}
        tails: ${{ inputs.tails }}
        token: ${{ github.token }}

  headroom:
    name: Free space if the repository is over its target
    needs: [clean_up_caches]
    if: ${{ !cancelled() }}
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
    - name: Clean up caches
      uses: gigabit-clowns/.github/.github/composites/clean-up-caches@main
      with:
        scope: headroom
        target_mib: ${{ inputs.target_mib }}
        token: ${{ github.token }}
