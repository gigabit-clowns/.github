name: Clean up caches
permissions: {}

on:
  workflow_call:
    inputs:
      scope:
        description: Which caches go, "superseded" or "all".
        required: true
        type: string
      ref:
        description: Ref or branch to restrict to. Every ref when left empty.
        required: false
        default: ""
        type: string
      patterns:
        description: >-
          One key pattern per line, `*` standing for what varies between the
          caches of one family. Of the caches the first matching pattern
          names on one ref, only the newest is kept; a cache no pattern
          matches is never superseded. Required by the superseded scope.
        required: false
        default: ""
        type: string
      by_stem:
        description: >-
          Keep the newest of each key stem a pattern matches rather than of
          the whole pattern. The stem is the key without the dates, hashes and
          long numbers it ends in, so one pattern such as `ccache-*` covers
          every family it names.
        required: false
        default: false
        type: boolean
      target_mib:
        description: What the headroom pass frees down to.
        required: false
        default: 8192
        type: number

jobs:
  clean_up_caches:
    name: Delete ${{ inputs.scope }} caches
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
    - name: Clean up caches
      uses: gigabit-clowns/.github/.github/composites/clean-up-caches@main
      with:
        scope: ${{ inputs.scope }}
        ref: ${{ inputs.ref }}
        patterns: ${{ inputs.patterns }}
        by_stem: ${{ inputs.by_stem }}
        token: ${{ github.token }}

  headroom:
    name: Free space if the repository is over its target
    needs: [clean_up_caches]
    if: ${{ !cancelled() }}
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
    - name: Clean up caches
      uses: gigabit-clowns/.github/.github/composites/clean-up-caches@main
      with:
        scope: headroom
        target_mib: ${{ inputs.target_mib }}
        token: ${{ github.token }}
