target-version = "py39"

include = [".github/scripts/**/*.py"]

[lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "PL",   # pylint
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PERF", # perflint
    "RUF",  # ruff-specific rules
]
ignore = [
    "D206", # docstring-tab-indentation: the project indents with tabs
]

[lint.pydocstyle]
convention = "pep257"
